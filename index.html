<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RE Commission Calculator — OpsDeck</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f6f3; --surface: #ffffff; --surface2: #f2f1ee;
  --border: rgba(0,0,0,0.08); --border-strong: rgba(0,0,0,0.14);
  --text: #1a1a18; --text-2: #6b6b67; --text-3: #9e9e9a;
  --bh: #0f6e56; --bh-bg: #e1f5ee; --bh-mid: #1D9E75;
  --ag: #185FA5; --ag-bg: #e6f1fb; --ag-mid: #378ADD;
  --ad: #854F0B; --ad-bg: #faeeda; --ad-mid: #EF9F27;
  --radius: 12px; --radius-sm: 8px;
  --blue: #1e4fa3; --yellow: #f5a800;
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 48px; font-size: 14px; }
.divider-bar { height: 4px; background: linear-gradient(90deg, var(--blue) 60%, var(--yellow) 100%); }
.top-bar { background: var(--surface); border-bottom: 0.5px solid var(--border-strong); padding: 12px 16px; }
.top-bar-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo-wrap img { height: 38px; width: auto; display: block; }
.header-right { text-align: right; }
.tool-title { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: -0.2px; }
.tool-desc { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.container { max-width: 540px; margin: 0 auto; padding: 16px 14px 0; }

.inputs-card { background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.inputs-row { display: flex; gap: 12px; }
.inputs-row .field { flex: 1; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 11px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; }
.hint { font-size: 11px; color: var(--text-3); margin-top: 4px; min-height: 15px; }

/* AED price field */
.price-wrap { position: relative; }
.price-wrap .currency { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--text-3); font-family: 'DM Sans', sans-serif; pointer-events: none; }
.price-wrap input { font-family: 'DM Mono', monospace; font-size: 15px; padding: 11px 13px 11px 42px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface2); color: var(--text); outline: none; width: 100%; -webkit-appearance: none; }
.price-wrap input:focus { border-color: var(--blue); }

/* Commission field — number input + % badge side by side inside a styled box */
.comm-box {
  display: flex;
  align-items: center;
  background: var(--surface2);
  border: 0.5px solid var(--border-strong);
  border-radius: var(--radius-sm);
  overflow: hidden;
  height: 44px;
}
.comm-box:focus-within { border-color: var(--blue); }
.comm-box input {
  font-family: 'DM Mono', monospace;
  font-size: 15px;
  border: none;
  background: transparent;
  color: var(--text);
  outline: none;
  /* shrink to fit content — starts narrow, grows with digits */
  width: 3ch;
  min-width: 2ch;
  max-width: 6ch;
  padding: 0 0 0 13px;
  -moz-appearance: textfield;
  -webkit-appearance: none;
}
.comm-box input::-webkit-outer-spin-button,
.comm-box input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.comm-pct {
  font-family: 'DM Mono', monospace;
  font-size: 15px;
  color: var(--text-2);
  padding: 0 4px 0 1px;
  line-height: 1;
  flex-shrink: 0;
}

.summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-bottom: 16px; }
.metric { background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--radius); padding: 13px 12px; position: relative; overflow: hidden; }
.metric::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
.metric.bh::before { background: var(--bh-mid); }
.metric.ag::before { background: var(--ag-mid); }
.metric.ad::before { background: var(--ad-mid); }
.metric-who { font-size: 10px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
.metric-name { font-size: 11px; font-weight: 500; color: var(--text); margin-bottom: 8px; line-height: 1.3; }
.metric-pct { font-size: 26px; font-weight: 300; letter-spacing: -1px; font-family: 'DM Mono', monospace; }
.metric-pct.bh { color: var(--bh); } .metric-pct.ag { color: var(--ag); } .metric-pct.ad { color: var(--ad); }
.metric-aed { font-size: 10px; color: var(--text-2); margin-top: 3px; font-family: 'DM Mono', monospace; }

.bar-row { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 16px; gap: 2px; }
.bar-seg { height: 100%; border-radius: 2px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }

.tabs-row { display: flex; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 12px; background: var(--surface2); }
.tab { flex: 1; padding: 10px 4px; font-size: 11px; font-weight: 500; font-family: 'DM Sans', sans-serif; text-align: center; cursor: pointer; background: transparent; color: var(--text-2); border: none; border-right: 0.5px solid var(--border-strong); transition: all 0.15s; line-height: 1.3; }
.tab:last-child { border-right: none; }
.tab.active { background: var(--surface); color: var(--blue); border-bottom: 2px solid var(--blue); }

.view { display: none; } .view.active { display: block; }
.table-wrap { background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; }
.stage-row { padding: 13px 14px; border-bottom: 0.5px solid var(--border); }
.stage-row:last-child { border-bottom: none; }
.stage-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
.stage-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.stage-num { font-size: 11px; color: var(--text-3); font-family: 'DM Mono', monospace; flex-shrink: 0; }
.stage-name { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.pct-pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; font-family: 'DM Mono', monospace; flex-shrink: 0; }
.stage-aed { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-2); flex-shrink: 0; }
.assign-sel { font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 9px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border-strong); background: var(--surface2); color: var(--text); cursor: pointer; width: 100%; outline: none; -webkit-appearance: none; }
.earn-row { padding: 14px; border-bottom: 0.5px solid var(--border); }
.earn-row:last-child { border-bottom: none; }
.earn-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.badge { display: inline-block; padding: 4px 11px; border-radius: 20px; font-size: 12px; font-weight: 500; }
.badge.bh { background: var(--bh-bg); color: var(--bh); }
.badge.ag { background: var(--ag-bg); color: var(--ag); }
.badge.ad { background: var(--ad-bg); color: var(--ad); }
.earn-pct { font-size: 22px; font-weight: 300; font-family: 'DM Mono', monospace; }
.earn-pct.bh { color: var(--bh); } .earn-pct.ag { color: var(--ag); } .earn-pct.ad { color: var(--ad); }
.earn-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); }
.earn-aed { font-family: 'DM Mono', monospace; font-weight: 500; color: var(--text); }
.pct-row { padding: 11px 14px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pct-row:last-child { border-bottom: none; }
.pct-stage-name { font-size: 12px; color: var(--text); flex: 1; min-width: 120px; }
.pct-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.pct-val { font-size: 12px; font-family: 'DM Mono', monospace; font-weight: 500; }
.pct-aed { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-2); }
.total-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 14px; background: var(--surface2); border-top: 0.5px solid var(--border-strong); font-size: 13px; font-weight: 500; }
.mono { font-family: 'DM Mono', monospace; }
.warn { font-size: 12px; color: #854F0B; padding: 10px 14px; background: #faeeda; border-radius: var(--radius-sm); margin-bottom: 12px; border: 0.5px solid #EF9F27; display: none; }
footer { margin-top: 32px; padding: 16px; font-size: 11px; color: var(--text-3); text-align: center; line-height: 1.8; }
footer span { color: var(--blue); font-weight: 500; }
</style>
</head>

      <div class="tool-title">Commission Calculator</div>
      <div class="tool-desc">Commission transparency tool by OpsDeck</div>
    </div>
  </div>
</div>

<div class="container">

  <div class="inputs-card">
    <div class="inputs-row">
      <div class="field">
        <label>Sale price (AED)</label>
        <div class="price-wrap">
          <span class="currency">AED</span>
          <input type="text" id="priceDisplay" placeholder="2,000,000" oninput="onPriceInput(this)" inputmode="numeric">
        </div>
        <div class="hint" id="priceWords"></div>
      </div>
      <div class="field">
        <label>Commission rate</label>
        <div class="comm-box">
          <input type="text" id="cpct" value="2" inputmode="decimal" oninput="onCommInput(this)" placeholder="2">
          <span class="comm-pct">%</span>
        </div>
        <div class="hint" id="commHint">Standard UAE rate: 2%</div>
      </div>
    </div>
  </div>

  <div style="padding:4px 2px 14px;">
    <span id="poolAmt" style="font-family:'DM Mono',monospace;font-size:17px;font-weight:700;color:var(--text)"></span>
    <span style="font-size:14px;color:var(--text-3);margin-left:6px;">is Total Commission Pool</span>
  </div>

  <div class="warn" id="warn">Stage allocations do not total 100% — please review.</div>
  <div class="summary-grid" id="summaryGrid"></div>
  <div class="bar-row" id="barRow"></div>

  <div class="tabs-row">
    <button class="tab active" onclick="showTab('assign',this)">Stage assignment</button>
    <button class="tab" onclick="showTab('earnings',this)">Earnings</button>
    <button class="tab" onclick="showTab('pct',this)">% Breakdown</button>
  </div>

  <div class="view active" id="assignView"><div class="table-wrap" id="assignBody"></div></div>
  <div class="view" id="earningsView"><div class="table-wrap" id="earningsBody"></div></div>
  <div class="view" id="pctView"><div class="table-wrap" id="pctBody"></div></div>

  <footer>
    Real Estate Commission Calculator &nbsp;·&nbsp; UAE Market<br>
    All values in AED &nbsp;·&nbsp; <span>OpsDeck</span> — Efficiency Matters
  </footer>
</div>

<script>
const stages = [
  { name: 'Inventory sourcing',     pct: 20, color: '#1D9E75' },
  { name: 'Marketing & portal ads', pct: 15, color: '#534AB7' },
  { name: 'Buyer acquisition',      pct: 25, color: '#993C1D' },
  { name: 'Deal closing',           pct: 20, color: '#185FA5' },
  { name: 'Transaction admin',      pct:  5, color: '#854F0B' },
  { name: 'Brokerage overhead',     pct: 15, color: '#5F5E5A' },
];
const stakeholders = [
  { key: 'bh', label: 'Brokerage house', cls: 'bh', bar: '#1D9E75' },
  { key: 'ag', label: 'Agent',           cls: 'ag', bar: '#378ADD' },
  { key: 'ad', label: 'Admin',           cls: 'ad', bar: '#EF9F27' },
];
const assignments = ['bh','bh','ag','ag','ad','bh'];

function addCommas(v) { return v.replace(/\D/g,'').replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function parsePrice() { return parseFloat(document.getElementById('priceDisplay').value.replace(/,/g,''))||0; }
function toWords(n) {
  if (!n) return '';
  if (n>=1000000) return (n/1000000).toFixed(n%1000000===0?0:2).replace(/\.?0+$/,'') + ' Million';
  if (n>=1000)    return (n/1000).toFixed(n%1000===0?0:1).replace(/\.?0+$/,'') + ' Thousand';
  return n.toLocaleString();
}
function onPriceInput(el) {
  const cur = el.selectionStart, prev = el.value.length;
  el.value = addCommas(el.value);
  const diff = el.value.length - prev;
  el.setSelectionRange(cur+diff, cur+diff);
  const num = parsePrice();
  document.getElementById('priceWords').textContent = num ? 'AED ' + toWords(num) : '';
  recalc();
}
function onCommInput(el) {
  const v = parseFloat(el.value)||0;
  const hint = document.getElementById('commHint');
  if (!v)        { hint.textContent=''; return; }
  if (v<1)       { hint.textContent='Below standard market rate'; hint.style.color='#854F0B'; }
  else if (v===2){ hint.textContent='Standard UAE rate: 2%'; hint.style.color='var(--text-3)'; }
  else if (v<=3) { hint.textContent=v+'% — above standard, confirm with client'; hint.style.color='var(--text-3)'; }
  else           { hint.textContent=v+'% — premium rate, ensure agreement is signed'; hint.style.color='#854F0B'; }
  recalc();
}

document.getElementById('priceDisplay').value = '2,000,000';
document.getElementById('priceWords').textContent = 'AED 2 Million';

const fmt = v => 'AED ' + Math.round(v).toLocaleString();
function getPool() {
  return parsePrice() * (parseFloat(document.getElementById('cpct').value)||2) / 100;
}

function recalc() {
  const pool = getPool();
  if (!pool) return;
  const totalPct = stages.reduce((a,s)=>a+s.pct,0);
  document.getElementById('warn').style.display = totalPct!==100?'block':'none';

  document.getElementById('poolAmt').textContent = fmt(pool);
  const earned={bh:0,ag:0,ad:0}, count={bh:0,ag:0,ad:0};
  stages.forEach((s,i)=>{ earned[assignments[i]]+=(s.pct/100)*pool; count[assignments[i]]++; });

  document.getElementById('summaryGrid').innerHTML = stakeholders.map(sh=>`
    <div class="metric ${sh.cls}">
      <div class="metric-who">Stakeholder</div>
      <div class="metric-name">${sh.label}</div>
      <div class="metric-pct ${sh.cls}">${Math.round(earned[sh.key]/pool*100)}%</div>
      <div class="metric-aed">${fmt(earned[sh.key])}</div>
    </div>`).join('');

  document.getElementById('barRow').innerHTML = stakeholders.map(sh=>{
    const w=Math.round(earned[sh.key]/pool*100);
    return `<div class="bar-seg" style="width:${w}%;background:${sh.bar}"></div>`;
  }).join('');

  document.getElementById('assignBody').innerHTML =
    stages.map((s,i)=>`
      <div class="stage-row">
        <div class="stage-top">
          <div class="stage-left">
            <span class="stage-num">${String(i+1).padStart(2,'0')}</span>
            <span class="dot" style="background:${s.color}"></span>
            <span class="stage-name">${s.name}</span>
          </div>
          <span class="pct-pill" style="background:${s.color}22;color:${s.color}">${s.pct}%</span>
          <span class="stage-aed">${fmt((s.pct/100)*pool)}</span>
        </div>
        <select class="assign-sel" onchange="assign(${i},this.value)">
          ${stakeholders.map(sh=>`<option value="${sh.key}"${assignments[i]===sh.key?' selected':''}>${sh.label}</option>`).join('')}
        </select>
      </div>`).join('')+
    `<div class="total-row"><span>Total pool</span><span class="mono">${fmt(pool)}</span></div>`;

  document.getElementById('earningsBody').innerHTML =
    stakeholders.map(sh=>{
      const pct=Math.round(earned[sh.key]/pool*100);
      return `<div class="earn-row">
        <div class="earn-top">
          <span class="badge ${sh.cls}">${sh.label}</span>
          <span class="earn-pct ${sh.cls}">${pct}%</span>
        </div>
        <div class="earn-meta">
          <span>${count[sh.key]} stage${count[sh.key]!==1?'s':''} owned</span>
          <span class="earn-aed">${fmt(earned[sh.key])}</span>
        </div>
      </div>`;
    }).join('')+
    `<div class="total-row"><span>Total pool</span><span class="mono">${fmt(pool)}</span></div>`;

  document.getElementById('pctBody').innerHTML =
    stages.map((s,i)=>{
      const sh=stakeholders.find(x=>x.key===assignments[i]);
      return `<div class="pct-row">
        <span class="dot" style="background:${s.color}"></span>
        <span class="pct-stage-name">${s.name}</span>
        <div class="pct-right">
          <span class="badge ${sh.cls}">${sh.label}</span>
          <span class="pct-val">${s.pct}%</span>
          <span class="pct-aed">${fmt((s.pct/100)*pool)}</span>
        </div>
      </div>`;
    }).join('')+
    `<div class="total-row"><span>Total</span><span class="mono">${fmt(pool)}</span></div>`;
}

function assign(i,val){assignments[i]=val;recalc();}
function showTab(tab,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('assignView').classList.toggle('active',tab==='assign');
  document.getElementById('earningsView').classList.toggle('active',tab==='earnings');
  document.getElementById('pctView').classList.toggle('active',tab==='pct');
}
recalc();
</script>
</body>
</html>
